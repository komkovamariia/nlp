[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-experiments"
version = "0.1.0"
description = "Experiments in text classification, embeddings, NER and retrieval"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0"]

[project.optional-dependencies]
notebooks = ["jupyter", "nbformat", "datasets", "transformers>=4.45", "torch", "accelerate", "seqeval", "gensim", "nltk", "spacy", "sentence-transformers", "matplotlib", "openpyxl", "requests"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
